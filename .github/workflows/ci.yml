name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing
      - name: Smoke test del CLI
        run: |
          sysdiag --version
          sysdiag list-checks

  powershell:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error -EnableExit
      - name: Ejecutar Invoke-QuickDiag.ps1 con Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\Invoke-QuickDiag.ps1 -SkipUpdates -OutFile diag.json
          $report = Get-Content diag.json -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Output "Estado general: $($report.overall_status)"
          if ($report.results.Count -lt 10) { throw 'El reporte tiene menos checks de los esperados' }
          exit 0

  bash:
    name: Bash (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh
      - run: shellcheck scripts/*.sh
      - name: Ejecutar quick_diag.sh y validar el JSON
        run: |
          bash scripts/quick_diag.sh -u -o diag.json || true
          python3 -m json.tool diag.json > /dev/null
          python3 -c "import json; r = json.load(open('diag.json')); print(r['overall_status'], r['summary'])"
